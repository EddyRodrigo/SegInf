{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'Front_end/css/styles.css' %}">
    <title>login</title>
</head>
<body class="front_end inicio">
    <h2>Inicia Sesión</h2>
    {% if messages %}
        {% for m in messages %}
         <p>{{ m }}</p>
         {% endfor %}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
    <p>¿No tienes una cuenta? <a href="{% url 'registro' %}" class="log">Registrarse</a></p>
</body>
</html>
