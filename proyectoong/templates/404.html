<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        body{
            background-color: #d4f0dc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        div{
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background-color: #f8020263;
        }
        .Error{
            font-size: 100px;
            color: #8b2e2e;
        }
        .detail{
            font-size: 40px;
            color: #8b2e2e;
        }
    </style>
    <title>404</title>
</head>
<body>
    <div>
        <h1 class="Error">404</h1>
        <sub class="detail">PAGE NOT FOUND</sub>
    </div>
</body>
</html>
